 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viator Login</title>
    <link rel="stylesheet" href="stylelogin.css">
 </head>
 <body>
    <div class="container">
        <div class="SignUp">
        <div class="Sign-container" >
            <img src="user.png" alt="userIcons" class="userIcons">
                <form action="#">
                    <label for="email">Email :</label><br>
                    <div class="input-group">
                        <i class="fi fi-rr-envelope" class="email-icon"></i>
                        <input type="email" class="email" placeholder="exemple@gmail.com">
                    </div>
                    <label for="password">password :</label><br>
                    <div class="input-group">
                        <i class="fi fi-rr-eye"></i>
                        <input type="password" class="password" placeholder="**************"><br>
                    </div>
                    <div class="input-condition">
                         <button type="button" class="button-signIn">Sign In</button>
                    </div>
                </form>
                <div class="rederect-lien">
                 <p >Don't have an account <a href="SignUp.html">Sign Up</a></p>
                </div>
        </div>
        </div>
    </div>
 </body>
 </html>
