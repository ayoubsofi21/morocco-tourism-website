    <main>
    <nav>
      <h1>Plan Your Moroccan Adventure Today</h1>

    </nav>
    <section id="SignUp" class="section1" style="display:none">
        <section class="Sign-container">
          <h3>Ready to Start your <br />Success Story ?</h3>
          <p>Signup to our website and start your favorite day</p>
          <div class="form">
            <label for="fullname">Full name :</label><br />
            <input
              type="text"
              class="fullname"
              name="fullname"
              placeholder="Ayoub Sofi"
            /><br />
            <label for="email">Email :</label>
            <div class="input-group">
              <i class="fi fi-rr-envelope" class="email-icon"></i>
              <input
                type="email"
                class="email"
                placeholder="exemple@gmail.com"
                name="email"
              />
            </div>

            <label for="password">password :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-eye"></i>
              <input
                type="password"
                class="password"
                name="password"
                placeholder="**************"
              /><br />
            </div>
            <div class="input-condition">
              <input type="radio" /><label
                ><span>I agree to the</span> Terms & Conditions</label
              ><br />
              <button type="button" class="button-signup">Sign Up</button>
            </div>
            <div class="rederect-lien">
              <p>Have an account <button >Sign in</button></p>
            </div>
          </div>
        </section>
    </section>
    <section class="container">
      <div id="SignUp1" class="section2" style="display:none;">
        <div class="Sign-container sign-in">
          <img src="images/user.png" alt="userIcons" class="userIcons" />
          <div class="form ">
            <label for="email">Email :</label>
            <div class="input-group">
              <i class="fi fi-rr-envelope" class="email-icon"></i>
              <input
                type="email"
                class="email"
                placeholder="exemple@gmail.com"
              />
            </div>
            <label for="password">password :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-eye"></i>
              <input
                type="password"
                class="password"
                placeholder="**************"
              /><br />
            </div>
            <div class="input-condition">
              <button type="button" class="button-signIn">Sign In</button>
            </div>
          </div>
          <div class="rederect-lien">
            <p>Don't have an account <a href="SignUp.html">Sign Up</a></p>
          </div>
        </div>
    </section>
</main>
