<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kechActivité</title>
    <link rel="stylesheet" href="stylle.css">
</head>
<body>

<header>
    <h1 id="Titre">MARAKECH : Quad, Chameau, Dîner & Spectacle</h1>
    <div class="sub-info">
        <p> 863 avis</p>
        <p> Recommandé par 99% des voyageurs</p>
        <p> Badge d'excellence</p>
    </div>
</header>

<div class="layout">

    <aside class="left-gallery">
        <img src="sahara.jpg">
        <img src="cc.jpg">
        <img src="gg.jpg">
        <img src="quad.webp">
        <button class="voir-plus">Voir plus</button>
    </aside>

 
    <main class="main-photo">
        <img src="kech.webp" class="hero">
   
    </main>


    <aside class="booking">

        <h2>
            À partir de 
            <span class="price">25,61 €</span> 
            par personne
        </h2>

        <label>Date</label>
        <input type="date">

        <label>Voyageurs</label>
        <select>
            <option>1 voyageur</option>
            <option>2 voyageurs</option>
            <option>3 voyageurs</option>
        </select>

        <button class="btn-check">Vérifier la disponibilité</button>

        <ul class="details">
            <li> Annulation gratuite jusqu'à 24h avant</li>
            <li>Réservez maintenant, payez plus tard</li>
        </ul>

    </aside>

</div>

</body>
</html>
