<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viator Website</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
      <header>
        <div class="left_header">
          <div class="morocco-logo">
            <img src="logo.png" alt="logotourist">
          </div>
        </div>
        <div class="center">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Destinations</a></li>
          <li><a href="#">Activities</a></li>
          <li><a href="#">Details</a></li>
        </ul>

        </div>
        <div class="righ_header">
          <div class="profilUser">
             
            <button type="button" class="icons">
              <img src="user.png" alt="user" />
              <svg
                viewBox="0 0 48 48"
                fill="none"
                class="avatarIcon__TCd7 md__qDd_ amp-block"
              >
                <circle
                  cx="24"
                  cy="24"
                  r="24"
                  fill="var(--viator-color-neutral-70)"
                ></circle>
                <path
                  d="M42.132 39.782c-3.53-6.346-10.305-10.64-18.082-10.64-7.851 0-14.6 4.228-18.101 10.674.081-.148-.034.061 0 0C10.333 44.878 16.76 48 24.05 48c7.213 0 13.683-3.182 18.082-8.218z"
                  fill="var(--viator-color-white)"
                ></path>
                <circle
                  cx="24"
                  cy="17.357"
                  r="10.5"
                  fill="var(--viator-color-white)"
                ></circle>
              </svg>
            </button>
            <button
              data-automation="discover-button"
              type="button"
              name="description"
              class="icon1"
            >
              <svg width="16" height="16">
                     
                <path
                  d="M11.72 5.34a.75.75 0 111.06 1.06l-4.25 4.26c-.3.29-.77.29-1.06 0L3.22 6.4a.75.75 0 011.06-1.06L8 9.06l3.72-3.72z"
                ></path>
              </svg>
            </button>
          </div>
        
        </div>
      
        <div class="clickDiv" style="display: none;">
                     <a href="Login.html">Login</a>
                </div>
      </header>
  </body>
   
             <script>
                const profilUser = document.querySelector('.profilUser');
                const clickDiv = document.querySelector('.clickDiv');

                profilUser.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clickDiv.style.display =
                    clickDiv.style.display === 'block' ? 'none' : 'flex';
                });

                document.addEventListener('click', () => {
                    clickDiv.style.display = 'none';
                });
            </script>

</html>
