<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viator Website</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link rel="stylesheet" href="loginStyle.css" />
  </head>
  <body>
    <header>
      <div class="left_header">
        <div class="morocco-logo">
          <img src="/images/logo.png" alt="logotourist" />
        </div>
      </div>
      <div class="righ_header">
        <div class="center">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Destinations</a></li>
            <li><a href="#">Activities</a></li>
            <li><a href="#">Details</a></li>
          </ul>
        </div>
        <div class="profilUser">
          <button type="button" class="icons">
            <img src="/images/user.png" alt="user" />
            <svg
              viewBox="0 0 48 48"
              fill="none"
              class="avatarIcon__TCd7 md__qDd_ amp-block"
            >
              <circle
                cx="24"
                cy="24"
                r="24"
                fill="var(--viator-color-neutral-70)"
              ></circle>
              <path
                d="M42.132 39.782c-3.53-6.346-10.305-10.64-18.082-10.64-7.851 0-14.6 4.228-18.101 10.674.081-.148-.034.061 0 0C10.333 44.878 16.76 48 24.05 48c7.213 0 13.683-3.182 18.082-8.218z"
                fill="var(--viator-color-white)"
              ></path>
              <circle
                cx="24"
                cy="17.357"
                r="10.5"
                fill="var(--viator-color-white)"
              ></circle>
            </svg>
          </button>
          <button
            data-automation="discover-button"
            type="button"
            name="description"
            class="icon1"
          >
            <svg width="16" height="16">
              <path
                d="M11.72 5.34a.75.75 0 111.06 1.06l-4.25 4.26c-.3.29-.77.29-1.06 0L3.22 6.4a.75.75 0 011.06-1.06L8 9.06l3.72-3.72z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="clickDiv" style="display: none">
        <button type="button" class="sign-in">Sign In</button>
        <button type="button" class="sign-up">SignUp</a>
      </div>
    </header>
    <div class="container">
      <div id="SignUp" class="section1" style="display: none">
        <div class="Sign-container">
          <h3>Ready to Start your <br />Success Story ?</h3>
          <p>Signup to our website and start your favorite day</p>
          <form action="#">
            <label for="fullname">Full name :</label><br />
            <input
              type="text"
              class="fullname"
              placeholder="Ayoub Sofi"
            /><br />
            <label for="email">Email :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-envelope" class="email-icon"></i>
              <input
                type="email"
                class="email"
                placeholder="exemple@gmail.com"
                name="email"
              />
            </div>

            <label for="password">password :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-eye"></i>
              <input
                type="password"
                class="password"
                name="password"
                placeholder="**************"
              /><br />
            </div>
            <div class="input-condition">
              <input type="radio" /><label
                ><span>I agree to the</span> Terms & Conditions</label
              ><br />
              <button type="button" class="button-signup">Sign Up</button>
            </div>
            <div class="rederect-lien">
              <p>Have an account <button >Sign in</button></p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="container">
      <div id="SignUp" class="section2" style="display: none;">
        <div class="Sign-container">
          <img src="/images/user.png" alt="userIcons" class="userIcons" />
          <form action="#">
            <label for="email">Email :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-envelope" class="email-icon"></i>
              <input
                type="email"
                class="email"
                placeholder="exemple@gmail.com"
              />
            </div>
            <label for="password">password :</label><br />
            <div class="input-group">
              <i class="fi fi-rr-eye"></i>
              <input
                type="password"
                class="password"
                placeholder="**************"
              /><br />
            </div>
            <div class="input-condition">
              <button type="button" class="button-signIn">Sign In</button>
            </div>
          </form>
          <div class="rederect-lien">
            <p>Don't have an account <a href="SignUp.html">Sign Up</a></p>
          </div>
        </div>
      </div>
    </div>
    <script>
      // click about user in header  and show button
      const profilUser = document.querySelector(".profilUser");
      const clickDiv = document.querySelector(".clickDiv");

      profilUser.addEventListener("click", (e) => {
        e.stopPropagation();
        clickDiv.style.display =
          clickDiv.style.display === "block" ? "none" : "flex";
      });

      document.addEventListener("click", () => {
        clickDiv.style.display = "none";
      });
      //  Show sign-in section when button is clicked
      const section1 = document.querySelector(".section1");
      document.querySelector(".sign-in").addEventListener("click", () => {
        section1.style.display =
          section1.style.display === "block" ? "none" : "flex";
      });
      const section2 = document.querySelector(".section2");

      document.querySelector(".sign-up").addEventListener("click", () => {
        
        section2.style.display =
          section2.style.display === "block" ? "none" : "flex";
      });
      // if(section1.style.display==='block'){
      //   section2.style.display==='none'
      // }else{
      //   section1.style.display==='none'
      // }
      document.querySelector(".sign-in").addEventListener("click", () => {
        section1.style.display = 'block';
        section2.style.display = 'none';
      });

      document.querySelector(".sign-up").addEventListener("click", () => {
        section2.style.display = 'block';
        section1.style.display = 'none';
      });

    </script>
</body>
</html>
