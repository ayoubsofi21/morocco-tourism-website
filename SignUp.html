<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>
    <div class="container">
        <div class="SignUp">
            <div class="Sign-container">
                <h3>Ready to Start your <br>Success Story ?</h3>
                <p>Signup to our website and start your favorite day</p>
                <form action="#">
                    <label for="name"  >Full name :</label><br>
                    <input type="text" class="name" placeholder="Ayoub Sofi"><br>
                    <label for="email">Email :</label><br>
                    <div class="input-group">
                        <i class="fi fi-rr-envelope" class="email-icon"></i>
                        <input type="email" class="email" placeholder="exemple@gmail.com">
                    </div>

                    <label for="password">password :</label><br>
                    <div class="input-group">
                        <i class="fi fi-rr-eye"></i>
                        <input type="password" class="password" placeholder="**************"><br>
                    </div>
                    <div class="input-condition">
                         <input type="radio"><label><span>I agree to the</span> Terms & Conditions</label><br>
                         <button type="button" class="button-signup">Sign Up</button>
                    </div>
                    <div class="rederect-lien">
                        <p>Have an account <a href="login.html">Sign in</a></p>
                    </div>
                   
                </form>
            </div>
        </div>
    </div>
</body>
</html>
